appId: com.deepseek.dsh-windows-desktop
productName: DeepSeek Harness
copyright: Copyright © 2026

directories:
  output: build/out
  buildResources: build

# asar disabled: the dsh backend runs via ELECTRON_RUN_AS_NODE=1, and asar
# archives caused repeated Windows-only failures (module resolution, file
# reads, unpacked-file redirection). Real files on disk eliminate the whole
# class of asar problems at a modest size cost.
asar: false

files:
  - dist/**/*
  - node_modules/**/*
  - build/icon.ico
  - package.json

win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
  artifactName: dsh-windows-desktop-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  shortcutName: DeepSeek Harness
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: dsh-windows-desktop-${version}-setup.${ext}

portable:
  artifactName: dsh-windows-desktop-${version}-portable.${ext}
